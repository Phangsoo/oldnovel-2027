<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2027 수능 대비 고전소설 주제 암기</title>
<style>
:root{color-scheme:light;--ink:#202c41;--muted:#718096;--line:#e3e9ef;--blue:#2463dc;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
main{max-width:710px;margin:0 auto;min-height:100svh;padding:clamp(22px,5vw,50px) 18px 38px;display:flex;flex-direction:column}
.top{text-align:center;margin:0 auto 27px}.eyebrow{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.09em;margin:0 0 12px}.heading{font-size:clamp(20px,4.5vw,28px);line-height:1.4;letter-spacing:-.045em;margin:0;font-weight:800}.sub{font-size:13px;color:var(--muted);margin:10px 0 0}
.card{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 32px rgba(28,51,89,.055);padding:clamp(24px,6vw,45px) clamp(20px,6vw,43px);flex:1;min-height:360px;display:flex;flex-direction:column;align-items:stretch}
.counter{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.work{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:185px}
.author{font-size:17px;font-weight:600;color:#637188;margin-bottom:17px}.work-title{font-size:clamp(30px,7vw,48px);line-height:1.35;font-weight:850;letter-spacing:-.065em;word-break:keep-all}.rule{height:1px;background:var(--line);margin:25px 0}
.answer{animation:up .23s ease both}.answer-label{font-size:13px;color:#61728e;font-weight:700;margin:0 0 12px}.theme{font-size:clamp(21px,4.5vw,28px);font-weight:850;line-height:1.6;letter-spacing:-.045em;word-break:keep-all;white-space:pre-wrap}.quote{margin:22px 0 0;padding:17px 19px;background:#f5f7fa;border-radius:14px;color:#5e6b7d;font-size:clamp(15px,3.4vw,17px);font-weight:400;line-height:1.85;white-space:pre-wrap;word-break:keep-all;text-align:left}
.actions{display:flex;gap:10px;margin-top:26px}.btn{border:0;border-radius:13px;padding:16px 14px;font-size:16px;font-weight:750;cursor:pointer;touch-action:manipulation;min-height:56px}.btn-primary{background:var(--blue);color:white;flex:1}.btn-back{background:#ecf0f6;color:#53617a;min-width:82px}.btn:focus-visible{outline:3px solid #a2baf3;outline-offset:2px}.foot{font-size:12px;color:#91a0b0;text-align:center;margin-top:20px}.hidden{display:none!important}@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(min-width:700px){main{padding-top:55px}.card{min-height:480px}}
</style>
</head>
<body><main>
<header class="top"><p class="eyebrow">2027학년도 수능 대비 · EBS 연계</p><h1 class="heading">고전소설 주제 암기</h1><p class="sub">제목을 보고 주제를 떠올려 보세요</p></header>
<section class="card" aria-live="polite"><div class="counter" id="counter"></div><div class="work"><div class="author" id="author"></div><div class="work-title" id="title"></div></div><div class="answer hidden" id="answer"><div class="rule"></div><div class="answer-label">작품의 주제</div><div class="theme" id="theme"></div><div class="quote" id="quote"></div></div><div class="actions"><button class="btn btn-back hidden" id="back" type="button">이전 작품</button><button class="btn btn-primary" id="primary" type="button">주제 확인하기</button></div></section>
<div class="foot">작품 순서는 접속할 때마다 무작위로 섞입니다.</div>
</main>
<script>
const ITEMS=[{"author": "작자 미상", "title": "임진록", "theme": "임진왜란의 과정에 대해 사실과 허구를 섞어 쓴 이야기", "excerpt": "EBS 본문에는 평양성 탈환 작전이 수록됨!"}, {"author": "이현기", "title": "포천이문", "theme": "실존 인물들의 가상 대화를 통해 북벌론의 허상을 비판하는 이야기", "excerpt": "지금 상황에서 청나라를 이길 수는 없소!\n북벌론은 허구요!"}, {"author": "작자 미상", "title": "왕수재취득용녀설", "theme": "왕수재가 용왕의 아들을 도와 구미호를 퇴치하고 용녀와 혼인하여 왕건을 낳는 이야기", "excerpt": "구미호가 너무 예뻐서 첫 번째 화살을 못 쐈다!"}, {"author": "작자 미상", "title": "서해무릉기", "theme": "납치된 아내를 찾아 재회하고 함께 탈출하는 이야기", "excerpt": "도적 장군에게 납치된 최 씨는 어떻게 탈출하여 유생과 재회할 수 있을지.."}, {"author": "작자 미상", "title": "반씨전", "theme": "반 씨 모자가 악인들의 박해를 극복하고 가문의 평화를 되찾는 이야기", "excerpt": "위진, 반 씨, 위흥(+) ↔ 위진, 채 씨, 위진, 맹 씨, 장생(-)"}, {"author": "작자 미상", "title": "현몽쌍룡기", "theme": "조용홍과 정채임이 혼사장애를 극복하고 결연하는 이야기", "excerpt": "계모의 핍박으로 남장 하고 도망치던 정채임과 시녀들이 절벽에서 뛰어내렸는데?\n하필 약혼남 조용흥이 이들을 구하게 된다!"}, {"author": "심의", "title": "대관재몽유록", "theme": "심의가 꿈속 문인 왕국에서 재주를 펼치다가 현실로 돌아오는 이야기", "excerpt": "문인 왕국에서 김시습이 반란을 일으켰다는 것은\n작가가 김시습을 겁나 싫어한다는 얘기겠지?"}, {"author": "미상", "title": "금방울전", "theme": "금방울(용녀)이 해룡을 도와 시련을 극복하고 인연을 이루는 이야기", "excerpt": "금방울은 만능!\n해룡이 공주를 구할 때도, 전쟁에서 이길 때도, 부모님과 재회할 족자를 남길 때도 모든 게 금방울 덕분이야!"}, {"author": "미상", "title": "적벽가", "theme": "교만한 조조가 적벽대전에서 크게 패하는 이야기", "excerpt": "병사들마저 조조 장군을 까는데, 전쟁에서 이길 리가?"}, {"author": "미상", "title": "옹고집전", "theme": "인색한 옹고집이 가짜 옹고집을 계기로 잘못을 뉘우치고 개과천선하는 이야기", "excerpt": "가짜를 만들어서 진짜를 쫓아낸다?\n악덕한 옹고집을 개과천선하게 만드는 유쾌한 방식!"}, {"author": "미상", "title": "옥단춘전", "theme": "옥단춘의 헌신과 도움으로 이혈룡이 친구 김진희에게 복수하는 이야기", "excerpt": "친구 김진희는 희대의 쓰레기! 배신자!\n옥단춘의 지극정성으로 과거도 붙고 어사도 되어 정의구현도 한다!"}, {"author": "이광정", "title": "김순부전", "theme": "김순부가 계속된 정치적 모함 끝에 비극적으로 죽음을 맞는 이야기", "excerpt": "조선 시대에 지방의 향촌 사회에서조차 정치적 견제와 질투, 권력과 세력 다툼이 심했는지 알 수 있죠?"}, {"author": "미상", "title": "인현황후전", "theme": "장희빈의 모함으로 폐위된 인현왕후가 복위되는 이야기", "excerpt": "장희빈 쪽 계열은 악인으로 묘사!\n인현황후는 쫓겨났음에도 겸손한 자세로 견디는 훌륭한 인물로 묘사!"}, {"author": "미상", "title": "황새결송", "theme": "부당한 판결을 받은 부자가 이야기를 지어 부패한 관리들을 풍자하는 이야기", "excerpt": "액자식 구성! (이야기 속의 이야기)\n청탁으로 억울하게 소송에서 진 부자가 똑같은 이야기를 우화로 만들어 관리들에게 들려줌."}, {"author": "미상", "title": "장풍운전", "theme": "장풍운이 시련을 극복하고 영웅이 되어 가족과 재회하는 이야기", "excerpt": "흔하디 흔한 영웅소설이다!\n어릴 적 가족과 헤어지는 주인공, 조력자에게 도움 받고 영웅이 됨, 전쟁에서 이기고 귀환하다가 아내와 어머니를 신물을 통해 만남! -> 뻔하잖아…"}, {"author": "미상", "title": "창선감의록", "theme": "심씨 모자의 박해를 받은 화진이 시련을 극복하고 가문을 회복하는 이야기", "excerpt": "심 씨(계모)와 화춘(첫째)은 (-) ↔ 화빙선(둘째), 화진은 (+)\n심지어 화춘의 둘째 부인 조 씨 및 그녀와 불륜 관계인 범한은 (------)"}, {"author": "미상", "title": "운영전", "theme": "운영과 김 진사가 사회적 제약 속에서 비극적 사랑을 하는 이야기", "excerpt": "궁궐 담장을 사이에 둔\n김 진사와 궁녀 운영의 눈물 나는 러브 스토리"}, {"author": "미상", "title": "두껍전", "theme": "두꺼비가 말재주와 허풍으로 여우를 제압하고 상좌를 차지하는 이야기", "excerpt": "내가 너보다 나이 많다! 내가 너보다 가본 곳 많다!\n상좌에 앉기 위해 허풍을 남발하는 동물들의 이야기"}, {"author": "미상", "title": "강로전", "theme": "강홍립이 전쟁을 회피하고 후금에 항복하여 나라를 배신하는 이야기", "excerpt": "강홍립을 부정적으로 묘사한 소설\n밀지 핑계를 대면서 후금과 적극적으로 싸우지 않는 강홍립의 모습!"}, {"author": "미상", "title": "이춘풍전", "theme": "방탕한 이춘풍이 아내의 활약으로 몰락에서 벗어나 개과천선하는 이야기", "excerpt": "이춘풍이 기생 추월에게 빠져 재산을 모두 탕진했지만\n아내가 남장을 하고 평양에 찾아가 해결해 줌!"}];
const order=Array.from({length:ITEMS.length},(_,i)=>i);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
shuffle(order);
let idx=0,shown=false;
const $=id=>document.getElementById(id);
function render(){const x=ITEMS[order[idx]];$('counter').textContent=`${idx+1} / ${ITEMS.length}`;$('author').textContent=x.author;$('title').textContent=`「${x.title}」`;$('theme').textContent=x.theme;$('quote').textContent=x.excerpt;$('quote').classList.toggle('hidden',!x.excerpt);$('answer').classList.toggle('hidden',!shown);$('primary').textContent=shown?(idx===order.length-1?'처음부터 다시':'다음 작품'):'주제 확인하기';$('back').classList.toggle('hidden',idx===0&&!shown)}
function next(){if(idx===order.length-1){shuffle(order);idx=0}else idx++;shown=false;render()}
$('primary').addEventListener('click',()=>{if(!shown){shown=true;render()}else next()});
$('back').addEventListener('click',()=>{if(shown){shown=false}else if(idx>0){idx--;shown=false}render()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight' || e.key==='Enter' && e.target.tagName!=='BUTTON'){$('primary').click()}else if(e.key==='ArrowLeft' && !$('back').classList.contains('hidden')){$('back').click()}});
render();
</script></body></html>
